<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Session 1: Introduction to Cybercrime Investigation</title>
<style>
:root{--bg:#f7f6f2;--card:#fff;--ink:#1d2433;--mut:#5d667a;--acc:#0b5fff;--ok:#0a7d4b;--bad:#c0392b;--line:#dcdad2;--warm:#b45309;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10141c;--card:#1a212d;--ink:#e8ecf4;--mut:#9aa5ba;--acc:#6aa0ff;--ok:#3fc78a;--bad:#ff7a6b;--line:#2c3547;--warm:#f5a35a}}
:root[data-theme="dark"]{--bg:#10141c;--card:#1a212d;--ink:#e8ecf4;--mut:#9aa5ba;--acc:#6aa0ff;--ok:#3fc78a;--bad:#ff7a6b;--line:#2c3547;--warm:#f5a35a}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;justify-content:space-between;padding:12px 18px;border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;font-size:14px}
header span{color:var(--mut)}#bar{height:3px;background:var(--acc);width:0;transition:width .3s}
main{max-width:760px;margin:0 auto;padding:22px 18px 90px}
.tag{color:var(--acc);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
h1{font-size:30px;line-height:1.15;margin:6px 0 10px}h2{font-size:24px;margin:6px 0 12px}h3{font-size:15px;margin:14px 0 3px}
p{margin:0 0 10px}.mut{color:var(--mut)}.sm{font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin:12px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
button{font:inherit;color:inherit;cursor:pointer}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin:6px 0}
.opt:hover{border-color:var(--acc)}.good{border-color:var(--ok)!important;background:color-mix(in srgb,var(--ok) 14%,var(--card))}.wrong{border-color:var(--bad)!important;background:color-mix(in srgb,var(--bad) 12%,var(--card))}
.box{background:color-mix(in srgb,var(--acc) 9%,var(--card));border-left:4px solid var(--acc);padding:10px 14px;border-radius:8px;margin:12px 0}
.ex{background:color-mix(in srgb,var(--warm) 11%,var(--card));border-left:4px solid var(--warm);padding:8px 12px;border-radius:8px;margin:8px 0}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.chip{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:6px 14px}.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
label.ck{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}
code{font:13px ui-monospace,Consolas,monospace;word-break:break-all}ol{margin:4px 0 8px;padding-left:22px}li{margin:3px 0}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;gap:8px;padding:10px 18px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line)}
nav button{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:10px 20px;font-weight:600}nav button:disabled{opacity:.35}
</style></head><body>
<header><b>Session 1 · Cybercrime Investigation</b><span id="pg"></span></header><div id="bar"></div>
<main id="m"></main>
<nav><button id="pv">← Previous</button><button id="nx">Next →</button></nav>
<script>
const $=s=>document.querySelector(s);
const rv=(a,id)=>`<div class="row" id="${id}">${a.map((x,i)=>`<button class="chip" data-i="${i}">${x[0]}</button>`).join('')}</div><div class="card" id="${id}o"><span class="mut">Tap an item above.</span></div>`;
const wr=(id,a,r)=>document.querySelectorAll('#'+id+' .chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('#'+id+' .chip').forEach(c=>c.classList.remove('on'));b.classList.add('on');$('#'+id+'o').innerHTML=r(a[b.dataset.i])});
const r3=(a,b)=>x=>`<p>${x[1]}</p><div class="ex"><b>${a}:</b> ${x[2]}</div>${x[3]?`<p class="sm"><b>${b}:</b> ${x[3]}</p>`:''}`;
const mcq=(id,q)=>q.map((x,i)=>`<div class="card" style="margin:8px 0"><b class="sm">${x[0]}</b>${x[1].map((o,j)=>`<button class="opt sm" data-m="${id}" data-q="${i}" data-j="${j}">${o}</button>`).join('')}</div>`).join('');
const wm=(id,q)=>document.querySelectorAll(`[data-m="${id}"]`).forEach(b=>b.onclick=()=>b.classList.add(+b.dataset.j==q[b.dataset.q][2]?'good':'wrong'));
const ERAS=[["🕰️ 1980s–90s Curiosity","Hackers explored networks for fun or fame. The first worms and viruses appeared, and few laws existed.","The 1988 Morris worm spread far faster than its author intended and slowed a large part of the early internet.","It led to one of the first prosecutions under US computer-crime law. Damage could be done without malice."],
["💌 2000s Mass spread","Email made it possible to reach millions at once. Motive shifted from fame to money, and phishing and online banking fraud began.","In 2000 the ILOVEYOU worm arrived as a 'love letter' attachment, mailed itself to the victim's contacts and hit millions of computers. The suspect was not prosecuted because local law had no computer-crime offence.","India passed the IT Act in the same year, 2000. Law always trails technology."],
["🏦 2010s Organised crime","Crime became a business: ransomware, banking trojans, dark-web markets, cryptocurrency payments.","A criminal buys ready-made ransomware from a dark-web seller and pays him a share of the profits. UPI (2016) put payments on every phone and gave fraudsters a faster channel.","Skill is no longer needed; money is."],
["🎣 2020s Scams at scale","Social engineering dominates: digital arrest, investment and task scams, sextortion, deepfake and AI-voice fraud, run from organised call centres, often across borders.","A voice clone of a relative phones in a panic and asks for money urgently. The voice sounds right; the request is wrong.","Verify through a second channel, like calling back on a saved number."]];
const TYPES=[["🎣 Phishing, vishing, smishing","Tricks by link (phishing), call (vishing) or SMS (smishing) to steal passwords, OTPs or card details.","An SMS says your electricity will be cut tonight, call this number. The 'officer' asks for an app install, and the phone is now remotely controlled.","Urgency, a link or number you did not request, and any request for OTP or screen sharing."],
["💸 UPI and payment fraud","Money taken through UPI, cards or wallets using trickery.","A seller on a marketplace sends a 'collect request' and says approve it to receive your money. Approving sends money out.","You never need to enter a PIN to receive money."],
["🔐 Ransomware and malware","Malicious software locks or steals data and demands payment, usually in cryptocurrency.","A hospital's patient records are encrypted, a note appears on every screen, and staff switch to paper.","A document that asks to 'enable macros', or a cracked-software installer."],
["📱 SIM swap and identity theft","The criminal gets a duplicate SIM or your documents to take over your number and accounts.","A phone suddenly loses signal. Minutes later bank OTPs, now going to the criminal's SIM, empty the account.","Sudden loss of signal with no reason, followed by bank alerts."],
["📸 Sextortion, morphing, stalking","Blackmail, harassment or fake intimate images used for money or control.","A teenager receives a friend request, a video call, and then a screen recording with a demand: pay or it goes to your contacts.","Quick move to private chat, intimate requests, and sudden threats."],
["🧩 Dependent vs enabled","Cyber-dependent: only possible with computers (hacking, ransomware, DDoS). Cyber-enabled: old crime made bigger by technology (fraud, trafficking, stalking).","Hacking a server is dependent. A fake job offer that takes advance money is enabled.","The split decides which law and which skills the investigation needs."]];
const ROLES=[["📞 Caller / scammer","Runs the call centre or Telegram group. Works from scripts and leaked data.","A trained team makes 500 calls a day, escalating to 'senior officers' when someone bites.","Trace the numbers, VoIP and SIM sellers, and the apps used."],["🧰 Tool and data supplier","Sells phishing kits, malware, leaked databases and spoofed-number services. 'Crime as a service'.","A kit sold for a small fee clones a bank's login page in minutes.","Find the sellers' channels and payment trail."],["🏧 Mule account holder","Lends or rents a bank account for a fee. Often the first person the police can reach.","A student gives his account to 'earn commission'. ₹6 lakh of fraud money passes through it in one day.","Treat as a lead, not just a suspect: ask who contacted him, what he was paid, and where the money went next."],["🔀 Cash-out and layering","Stolen money is split, moved through many accounts, converted to crypto or withdrawn.","₹10 lakh is split into 40 transfers across 25 accounts within an hour.","Freeze early, follow each hop, and watch ATM withdrawal locations."],["🌐 Infrastructure","SIM cards, VPNs, hosting, fake apps, fake websites, often abroad.","A fake investment app is hosted on a server abroad and promoted by a recently created domain.","Check WHOIS dates, hosting provider and registrar abuse contacts."]];
const CASES=[["🏥 WannaCry (2017)","In May 2017 ransomware spread worldwide and hit hospitals, companies and public bodies in 150+ countries, including the UK's NHS.","It used a known flaw in unpatched Windows file-sharing and spread by itself. A researcher found a 'kill switch' domain that slowed it.","Patching old systems is cheap; ignoring them is not."],
["🏦 Bangladesh Bank (2016)","Attackers entered the bank's network and sent fraudulent SWIFT payment orders from its account at the New York Fed. About $81 million reached accounts abroad out of nearly $1 billion attempted.","A spelling mistake in a payment instruction made another bank suspicious and halted further transfers.","Small human errors often break big attacks. Money moved across borders in hours."],
["⛽ Colonial Pipeline (2021)","A US fuel pipeline operator was hit by ransomware and shut down operations as a precaution, causing fuel shortages on the US East Coast.","The company paid about 75 bitcoin. US authorities later recovered a large part by seizing it through the cryptocurrency trail.","Crypto is traceable. Following the wallet trail can recover money."],
["🏨 AIIMS Delhi (2022)","In November 2022 the hospital's servers were hit by ransomware, and services such as registration and billing had to run on paper for days.","The attack hit systems that hold patient records, which shows how critical-sector attacks stop real-life services.","Offline backups and incident response plans save time and lives."]];
const DA=[["Victim gets a call: 'a parcel in your name has drugs' or 'your Aadhaar is misused'.","Real agencies do not start with a phone call."],["The call is transferred to a fake CBI or police officer on a video call with a staged office background.","A uniform on a video call proves nothing."],["Victim is told not to tell anyone and to stay on camera: 'digital arrest'.","Isolation is the scammer's main tool."],["Victim is told to move savings to a 'safe RBI account' for verification.","No agency asks for money to prove innocence."],["Money lands in mule accounts, splits within minutes, goes to wallets or crypto.","This is the stage where speed matters."],["Victim realises and calls 1930. Fast reporting can still freeze part of the money.","The first hour is the investigator's best chance."]];
const CH=[["⏳ Volatile evidence","Chats, logs and cloud data are overwritten or deleted.","A scam group deletes its Telegram channel overnight. If a preservation request went out the same day, the platform may still hold the data.","Send preservation requests early, and screenshot first."],["🗺️ Jurisdiction","Victim in one place, accused in another state or country, servers elsewhere.","A victim in Kohima pays an account in another state while the caller sits in a third location.","Register a zero FIR and use NCRP / 1930 and the nodal-officer network."],["🥷 Anonymity","VPNs, burner SIMs, fake KYC and crypto mixers hide identity.","A SIM bought on a forged ID is used for a week and thrown away.","Look for human slips: reused numbers, device IDs, linked accounts."],["⚡ Speed","Money leaves in minutes; each hour reduces recovery.","Frozen in the first hour, 80% may be recoverable; after a day, it may be gone.","Prioritise calls to the bank and 1930 before anything else."],["🎓 Capacity and awareness","Evidence handling, tools and training gaps; victims are often embarrassed to report.","A victim of a sextortion scam hides it for weeks, and evidence is lost.","Be non-judgemental and keep reporting easy."],["⚖️ Legal and proof","Electronic evidence must be proved properly in court.","A screenshot with no hash and no certificate may be challenged.","Covered in Session 2."]];
const TL=[["🌐 NCRP and 1930","Report cyber-crime online or by phone.",["Call 1930 immediately for a financial fraud, with transaction ID, amount, time and accounts.","Open cybercrime.gov.in, choose the right complaint category.","Register with a mobile number and OTP, fill in details, upload screenshots.","Submit and note the acknowledgement number."],"Hours matter. Call first, file next."],["📵 Sanchar Saathi","A government portal to check mobiles, SIMs and fraud calls.",["Open sancharsaathi.gov.in.","'Know your mobile connections': enter your number, OTP, see all SIMs registered in your name.","Report numbers that are not yours.","Use Chakshu to report suspected fraud calls or messages; block a lost phone by IMEI."],"Portal names and layouts change, so check the current page."],["🛡️ VirusTotal","Check a suspicious link or file without opening it.",["Open virustotal.com.","Choose URL, paste the link, press Enter.","Read how many engines flag it and the community comments.","Screenshot the result for the case file."],"Never click an unknown link just to test it."],["🔎 WHOIS / ICANN lookup","See who registered a domain, and when.",["Open lookup.icann.org.","Enter the domain.","Note registrar, creation date and name servers.","Send takedown or data requests to the registrar's abuse contact."],"A domain a few days old posing as a bank is a red flag."],["🖼️ Reverse image search","Find where a profile photo really comes from.",["Open Google Images or Google Lens.","Upload the photo or paste its URL.","Check whether it belongs to another person elsewhere online."],"A stock or stolen photo points to a fake profile."],["🔓 Have I Been Pwned","Check if an email address appeared in a data breach.",["Open haveibeenpwned.com.","Enter the email address.","Note which breaches are listed.","Advise changing that password everywhere and turning on two-step login."],"Breached data is how scammers know your name and number."]];
const FH=["Note exact time, amount, UTR / transaction IDs and account numbers","Victim calls 1930 or files at cybercrime.gov.in at once, so the bank can freeze funds","Ask the bank's nodal officer to hold the money in the beneficiary accounts","Save chats, call logs, numbers, links and app names; victim must not delete anything","Do not open or reset the victim's phone; airplane mode if it must be seized","Send preservation notices to the platform and telecom operator","Register the FIR or NCRP complaint; treat accounts as a trail, not final suspects"];
const SC=[["A caller in 'CBI uniform' says you are under digital arrest and must transfer money for 'verification'.",["Ransomware","Social-engineering fraud (digital arrest)","SIM swap"],1],["A hospital's files are encrypted and 0.5 BTC is demanded.",["Ransomware","Sextortion","Phishing"],0],["A woman's edited photos arrive with a payment demand.",["UPI fraud","Sextortion / morphing","SIM swap"],1],["A phone loses signal; minutes later the account is emptied.",["SIM swap","Smishing","Ransomware"],0]];
const QZ=[["Why is the first hour so important in a UPI fraud?",["Funds can still be frozen before cash-out","The FIR deadline ends","The bank closes"],0],["The person who rented out his bank account is usually…",["The mastermind","A mule: a link to trace upward","Always innocent"],1],["Ransomware is best described as…",["Cyber-dependent crime","Only a state crime","Cyber-enabled old crime"],0],["A seller asks you to approve a 'collect request' to receive money. You should…",["Approve it","Refuse: receiving money needs no PIN","Share the OTP"],1],["Which helpline reports financial cyber-fraud in India?",["100","1930","1098"],1]];
const S=[
()=>`<div class="tag">Session 1 · 90 minutes</div><h1>Introduction to Cybercrime Investigation</h1><p class="mut">Plain-words explanations, real-life examples, real case files and a tool guide.</p><div class="grid"><div class="card"><b>1 · Evolution</b><br><span class="mut sm">4 eras</span></div><div class="card"><b>2 · Types</b><br><span class="mut sm">6 types + quiz</span></div><div class="card"><b>3 · Ecosystem</b><br><span class="mut sm">5 roles</span></div><div class="card"><b>4 · Real case files</b><br><span class="mut sm">4 cases</span></div><div class="card"><b>5 · Digital arrest</b><br><span class="mut sm">step by step</span></div><div class="card"><b>6 · Challenges</b><br><span class="mut sm">6 issues</span></div><div class="card"><b>7 · First hour</b><br><span class="mut sm">checklist</span></div><div class="card"><b>8 · Tool guide</b><br><span class="mut sm">6 tools</span></div></div><p class="sm mut">Use ← → keys or the buttons. Verify figures and portal names before quoting them in training.</p>`,
()=>`<div class="tag">Part 1</div><h2>How cybercrime evolved</h2><p class="sm mut">Tap each era. Motive moves from fame to money to industrial scale.</p>${rv(ERAS,'er')}<div class="box"><b>Remember:</b> technology changes; the criminal's goal (money, power, revenge) does not.</div>`,
()=>`<div class="tag">Part 2</div><h2>Types of cybercrime</h2>${rv(TYPES,'ty')}<h3>Name the crime</h3>${mcq('sc',SC)}`,
()=>`<div class="tag">Part 3</div><h2>The cybercrime ecosystem</h2><p>Few crimes are committed by one person. Tap each role in the chain.</p>${rv(ROLES,'ec')}<div class="box"><b>Investigator's rule:</b> follow the money and the infrastructure, not just the caller.</div>`,
()=>`<div class="tag">Case files</div><h2>Real cases</h2>${rv(CASES,'cf')}`,
()=>`<div class="tag">Live case</div><h2>Digital arrest scam</h2><p class="sm mut">Illustrative pattern, not a single named case. Tap to reveal each step and its red flag.</p><div id="cs"></div><button class="opt" id="cn">Show next step</button><div class="box"><b>Fact:</b> there is no 'digital arrest' in Indian law. Police and agencies never demand money over a video call.</div>`,
()=>`<div class="tag">Part 4</div><h2>Challenges in investigation</h2>${rv(CH,'ch')}`,
()=>`<div class="tag">Practical</div><h2>The first-hour checklist</h2><p>Tick as you walk through a UPI-fraud complaint.</p><div id="fh"></div><p class="sm mut" id="fc"></p>`,
()=>`<div class="tag">How-to</div><h2>Tool guide</h2><p class="sm mut">Free, public tools every first responder can use. Tap for steps.</p>${rv(TL,'tg')}`,
()=>`<div class="tag">Wrap-up</div><h2>Exit quiz</h2>${mcq('qz',QZ)}<div class="box"><b>Takeaways:</b> tools change, motive does not · the ecosystem has many links · speed saves money · preserve evidence first.</div><p class="sm mut">Next: Session 2, IT Act, BNS, digital evidence and jurisdiction.</p>`];
const tg=x=>`<p><b>Use it for:</b> ${x[1]}</p><ol>${x[2].map(s=>`<li>${s}</li>`).join('')}</ol><div class="ex"><b>Tip:</b> ${x[3]}</div>`;
const I=[()=>{},()=>wr('er',ERAS,r3('Example','Why it matters')),()=>{wr('ty',TYPES,r3('Example','Red flag'));wm('sc',SC)},()=>wr('ec',ROLES,r3('Example','How to trace')),()=>wr('cf',CASES,r3('How it worked','Lesson')),()=>{let i=0;const sh=()=>{$('#cs').innerHTML=DA.slice(0,i+1).map((s,k)=>`<div class="card" style="margin:6px 0"><b>${k+1}.</b> ${s[0]}<div class="sm mut"><b style="color:var(--bad)">Red flag:</b> ${s[1]}</div></div>`).join('');if(i>=DA.length-1)$('#cn').style.display='none'};sh();$('#cn').onclick=()=>{i++;sh()}},()=>wr('ch',CH,r3('Example','What to do')),()=>{$('#fh').innerHTML=FH.map((t,i)=>`<label class="ck"><input type="checkbox"><span>${t}</span></label>`).join('');const u=()=>{$('#fc').textContent=document.querySelectorAll('#fh input:checked').length+' of '+FH.length+' done'};document.querySelectorAll('#fh input').forEach(c=>c.onchange=u);u()},()=>wr('tg',TL,tg),()=>wm('qz',QZ)];
let p=0;
function go(n){p=Math.max(0,Math.min(S.length-1,n));$('#m').innerHTML=S[p]();I[p]();$('#pg').textContent=(p+1)+' / '+S.length;$('#bar').style.width=((p+1)/S.length*100)+'%';$('#pv').disabled=p==0;$('#nx').disabled=p==S.length-1;scrollTo(0,0);try{history.replaceState(null,'','#'+(p+1))}catch(e){}}
$('#pv').onclick=()=>go(p-1);$('#nx').onclick=()=>go(p+1);
addEventListener('keydown',e=>{if(e.key=='ArrowRight')go(p+1);if(e.key=='ArrowLeft')go(p-1)});
go((parseInt(location.hash.slice(1))||1)-1);
</script></body></html>
